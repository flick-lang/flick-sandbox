name: Sandbox image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      nix: ${{ steps.filter.outputs.nix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            nix:
              - '**/*.nix'
              - flake.lock
              - .github/workflows/image.yml

  build:
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      REPOSITORY: vcr.vercel.com/max-larssons-projects/flick-sandbox/sandbox
      PUBLISH: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@4b040423529d49b1a19ba918742e0aa9aa95031a # v3.24.3

      - name: Set up Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-gha-cache: true
          use-flakehub: false

      - name: Check flake.lock health
        uses: DeterminateSystems/flake-checker-action@786422608c7bded2bbc9741ad9f91356842bf520 # v14

      - name: Build Docker image
        run: nix build .#ociImages.x86_64-linux.sandbox

      - name: Write Docker image
        if: env.PUBLISH == 'false'
        run: ./result > sandbox.tar

      - name: Upload Docker image
        if: env.PUBLISH == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sandbox-image
          path: sandbox.tar
          retention-days: 7

      - name: Log in to Vercel Container Registry
        if: env.PUBLISH == 'true'
        uses: vercel/vcr-action/login@768239251a1d0187eefddeb7d752d38169a89899 # v1
        with:
          team: ${{ vars.VERCEL_TEAM_ID }}

      # Pushed under a unique tag; sandboxes use :latest, which is only promoted once the image is optimized
      - name: Push to Vercel Container Registry
        if: env.PUBLISH == 'true'
        run: ./result | skopeo copy --dest-compress-format zstd docker-archive:/dev/stdin "docker://$REPOSITORY:$GITHUB_SHA"

      - name: Wait for optimization
        if: env.PUBLISH == 'true'
        id: optimized
        uses: vercel/vcr-action/wait-for-optimized-image@768239251a1d0187eefddeb7d752d38169a89899 # v1
        with:
          image: ${{ env.REPOSITORY }}:${{ github.sha }}
          timeout-seconds: 600

      - name: Promote the optimized image to latest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.optimized.outputs.digest }}
        run: skopeo copy --preserve-digests "docker://$REPOSITORY@$DIGEST" "docker://$REPOSITORY:latest"

