name: Sandbox image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      nix: ${{ steps.filter.outputs.nix }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            nix:
              - '**/*.nix'
              - flake.lock
              - .github/workflows/image.yml

  build:
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      REPOSITORY: vcr.vercel.com/max-larssons-projects/flick-sandbox/sandbox
      PUBLISH: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Set up Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-gha-cache: true
          use-flakehub: false

      - name: Check flake.lock health
        uses: DeterminateSystems/flake-checker-action@v14

      - name: Build Docker image
        run: nix build .#ociImages.x86_64-linux.sandbox

      - name: Write Docker image
        if: env.PUBLISH == 'false'
        run: ./result > sandbox.tar

      - name: Upload Docker image
        if: env.PUBLISH == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: sandbox-image
          path: sandbox.tar
          retention-days: 7

      - name: Log in to Vercel Container Registry
        if: env.PUBLISH == 'true'
        uses: vercel/vcr-action/login@v1
        with:
          team: ${{ vars.VERCEL_TEAM_ID }}

      # Pushed under a unique tag; sandboxes use :latest, which is only promoted once the image is optimized
      - name: Push to Vercel Container Registry
        if: env.PUBLISH == 'true'
        run: ./result | skopeo copy --dest-compress-format zstd docker-archive:/dev/stdin "docker://$REPOSITORY:$GITHUB_SHA"

      - name: Wait for optimization
        if: env.PUBLISH == 'true'
        id: optimized
        uses: vercel/vcr-action/wait-for-optimized-image@v1
        with:
          image: ${{ env.REPOSITORY }}:${{ github.sha }}
          timeout-seconds: 600

      - name: Promote the optimized image to latest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.optimized.outputs.digest }}
        run: skopeo copy --preserve-digests "docker://$REPOSITORY@$DIGEST" "docker://$REPOSITORY:latest"

